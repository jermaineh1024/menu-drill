<svg class="stations pic" viewBox="0 0 340 242" role="img" aria-label="Cooling hot food: from 135 degrees down to 70 within 2 hours, then from 70 down to 41 within 4 more hours, 6 hours in all. Heat meatballs, tomato sauce and soups to 165 degrees for 15 seconds. Hold hot food at 135 or higher and cold food at 41 or below."><rect x="0" y="6" width="340" height="122" rx="10"/><path class="ln" d="M12 46 H104 V78 H222 V110 H328"/><text x="16" y="38" text-anchor="start" class="mid">135°F</text><text x="110" y="70" text-anchor="start" class="mid">70°F</text><text x="228" y="102" text-anchor="start" class="mid">41°F</text><text x="190" y="70" text-anchor="middle" class="tk">in 2 hours</text><text x="300" y="102" text-anchor="middle" class="tk">+ 4 hours</text><text x="58" y="98" text-anchor="middle" class="t1">COOLING</text><text x="58" y="114" text-anchor="middle" class="ts">6 hours in all</text><rect x="0" y="136" width="108" height="100" rx="10" class="warnb"/><text x="54" y="155" text-anchor="middle" class="t1">HEAT</text><text x="54" y="181" text-anchor="middle" class="temp-big">165°F</text><text x="54" y="198" text-anchor="middle" class="ts">for 15 seconds:</text><text x="54" y="211" text-anchor="middle" class="ts">meatballs, sauce,</text><text x="54" y="224" text-anchor="middle" class="ts">soups</text><rect x="116" y="136" width="108" height="100" rx="10" class="warnb"/><text x="170" y="155" text-anchor="middle" class="t1">HOLD HOT</text><text x="170" y="181" text-anchor="middle" class="temp-big">135°F</text><text x="170" y="198" text-anchor="middle" class="ts">or higher, in</text><text x="170" y="211" text-anchor="middle" class="ts">the steam table</text><rect x="232" y="136" width="108" height="100" rx="10" class="okb"/><text x="286" y="155" text-anchor="middle" class="t1">HOLD COLD</text><text x="286" y="181" text-anchor="middle" class="temp-big">41°F</text><text x="286" y="198" text-anchor="middle" class="ts">or below</text></svg>
